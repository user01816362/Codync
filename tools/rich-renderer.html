<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-codync-renderer'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<style>
:root{color-scheme:light dark;font:14px system-ui}body{margin:8px;background:transparent;color:CanvasText}pre{white-space:pre;tab-size:2;font:13px ui-monospace,monospace}#output{overflow:auto}svg{max-width:100%;height:auto}math{font-size:1.15em}.hljs-keyword,.hljs-selector-tag,.hljs-literal{color:light-dark(#6f32a8,#cf9aff)}.hljs-string,.hljs-attr{color:light-dark(#28733b,#91cc99)}.hljs-comment{color:light-dark(#696969,#aaa)}.hljs-number,.hljs-built_in,.hljs-title{color:light-dark(#9a5126,#e4b28b)}#error{white-space:pre-wrap;font-size:13px}
</style></head><body><div id="output" role="region" aria-label="Rendered content"></div><p id="error" role="status"></p>
<script nonce="codync-renderer">
'use strict';
const assets=__CODYNC_ASSETS__;
const payload=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob('__CODYNC_PAYLOAD__'),c=>c.charCodeAt(0))));
async function load(name){
 const bytes=Uint8Array.from(atob(assets[name]),c=>c.charCodeAt(0));
 const source=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
 const script=document.createElement('script');script.nonce='codync-renderer';script.textContent=source;document.head.append(script);
}
(async()=>{
 const output=document.getElementById('output');
 if(typeof payload.source!=='string'||payload.source.length>16000)throw new Error('Preview is limited to 16,000 characters.');
 if(payload.kind==='mermaid'){
  if(/%%\s*\{|^\s*---/m.test(payload.source))throw new Error('Diagram configuration directives are not supported.');
  await load('mermaid');
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',suppressErrorRendering:true,maxTextSize:16000,maxEdges:200,flowchart:{htmlLabels:false},secure:['securityLevel','startOnLoad','maxTextSize','maxEdges','suppressErrorRendering']});
  const result=await mermaid.render('diagram',payload.source);output.innerHTML=result.svg;
  output.querySelectorAll('a').forEach(a=>{a.removeAttribute('href');a.removeAttribute('xlink:href')});
  const svg=output.querySelector('svg');
  if(svg){
   const controls=document.createElement('div');controls.setAttribute('role','toolbar');controls.setAttribute('aria-label','Diagram zoom');
   controls.style.cssText='display:flex;gap:8px;align-items:center;padding:6px 0;position:sticky;top:0;background:Canvas;color:CanvasText;z-index:1';
   output.before(controls);output.style.cssText+=';overflow:auto;max-height:calc(100vh - 54px);touch-action:pan-x pan-y';
   output.tabIndex=0;output.setAttribute('aria-label','Diagram. Scroll to pan; use plus, minus or zero to zoom.');
   const natural=Math.max(1,Math.min(16384,svg.viewBox.baseVal.width||svg.getBoundingClientRect().width));
   const fit=()=>Math.min(1,Math.max(.1,(document.documentElement.clientWidth-24)/natural));
   let zoom=fit();const label=document.createElement('span');label.setAttribute('aria-live','polite');
   const apply=()=>{svg.style.maxWidth='none';svg.style.width=(natural*zoom)+'px';svg.style.height='auto';label.textContent=Math.round(zoom*100)+'%'};
   const change=value=>{zoom=Math.max(.1,Math.min(8,value));apply()};
   for(const [title,action] of [['−',()=>change(zoom/1.25)],['+',()=>change(zoom*1.25)],['Fit',()=>change(fit())]]){
    const button=document.createElement('button');button.type='button';button.textContent=title;button.setAttribute('aria-label',title==='−'?'Zoom out':title==='+'?'Zoom in':'Fit diagram');button.onclick=action;controls.append(button);
   }
   controls.append(label);output.addEventListener('keydown',event=>{if(['+','=','-','0'].includes(event.key)){event.preventDefault();change(event.key==='0'?fit():event.key==='-'?zoom/1.25:zoom*1.25)}});apply();
  }

 }else if(payload.kind==='inline-math'){
  await load('katex');
  document.documentElement.style.fontSize=Math.max(12,Math.min(40,Number(payload.fontSize)||14))+'px';
  output.style.overflow='visible';let cursor=0;
  const pattern=/\\\(([^\n]{1,1024}?)\\\)|(?<!\\)\$([^$\n]{1,1024}?)\$/g;
  for(const match of payload.source.matchAll(pattern)){
   const math=match[1]??match[2];
   if(match[1]===undefined&&!(math.trim()===math&&(/[\\^_=+*/{}]/.test(math)||/^[A-Za-z]$/.test(math))))continue;
   output.append(document.createTextNode(payload.source.slice(cursor,match.index)));
   const span=document.createElement('span');
   try{katex.render(math,span,{displayMode:false,output:'mathml',trust:false,strict:'error',maxExpand:1000,maxSize:20,throwOnError:true})}catch{span.textContent=match[0]}
   output.append(span);cursor=match.index+match[0].length;
  }
  output.append(document.createTextNode(payload.source.slice(cursor)));
  const measure=()=>{
   const height=Math.min(1200,Math.max(24,Math.ceil(output.getBoundingClientRect().height+16)));
   window.parent.postMessage({kind:'codync-layout',height},'*');
   window.webkit?.messageHandlers?.layout?.postMessage(height);
   window.CodyncLayout?.height(height);
  };
  new ResizeObserver(()=>requestAnimationFrame(measure)).observe(output);measure();
 }else if(payload.kind==='math'){
  await load('katex');
  katex.render(payload.source,output,{displayMode:true,output:'mathml',trust:false,strict:'error',maxExpand:1000,maxSize:20,throwOnError:true});
 }else{
  await load('highlight');
  const pre=document.createElement('pre');const code=document.createElement('code');pre.append(code);output.append(pre);
  if(payload.language&&hljs.getLanguage(payload.language))code.innerHTML=hljs.highlight(payload.source,{language:payload.language,ignoreIllegals:true}).value;
  else code.textContent=payload.source;
 }
})().catch(()=>{document.getElementById('output').replaceChildren();document.getElementById('error').textContent='This content could not be rendered. Choose Code to inspect the original source.'});
document.addEventListener('click',event=>event.preventDefault());
</script></body></html>
