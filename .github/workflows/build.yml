name: Build

# Builds the desktop app on every push to main so it can be downloaded and tried without
# Xcode, a Rust toolchain or disk space. No repository secrets are used: the app is built
# for Apple Silicon only and signed ad-hoc, so macOS needs one `xattr` command to open it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # The release step at the end publishes the build; everything else only reads.
  contents: write

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One macOS job on purpose: two jobs asking for a macOS arm64 runner at once race for
  # scarce capacity, and a job that waits 15 minutes without one is cancelled.
  # `xcode-27` is GitHub's macOS 27 image, with Xcode 27 as the default.
  macos:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Rust (host/rust-toolchain.toml)
        working-directory: host
        run: rustup toolchain install

      - name: Check Rust formatting before expensive builds
        working-directory: host
        run: cargo fmt --all --check

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Check desktop types and tests
        working-directory: apps/desktop
        run: |
          npm run typecheck
          npm test

      - name: Check offline rich rendering in an isolated browser
        working-directory: apps/desktop
        run: |
          npx playwright install chromium
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { readFile } from 'node:fs/promises'
          import { chromium } from '@playwright/test'
          const template = await readFile('src/renderer/views/thread/rich-renderer.html', 'utf8')
          const appHTML = await readFile('src/renderer/index.html', 'utf8')
          const appCSP = appHTML.match(/http-equiv="Content-Security-Policy" content="([^"]+)"/i)?.[1]
          assert.ok(appCSP, 'Use the actual app content security policy in preview checks')
          const previewURL = 'https://preview.codync.invalid/renderer'
          const browser = await chromium.launch()
          try {
            const context = await browser.newContext({ offline: true })
            const requests = []
            context.on('request', request => requests.push(request.url()))
            for (const [kind, language, source, selector] of [
              ['code', 'javascript', 'const answer = 42;', '#output .hljs-keyword'],
              ['math', 'math', String.raw`\frac{1}{2}`, '#output math'],
              ['inline-math', 'inline-math', '**Value $x$** and `$y$`', '#output strong math'],
              ['mermaid', 'mermaid', 'graph TD; A-->B;', '#output svg'],
            ]) {
              const page = await context.newPage()
              const html = template.replace('__CODYNC_PAYLOAD__', Buffer.from(JSON.stringify({ kind, language, source })).toString('base64'))
              // Stand in for the app's existing local artifact protocol, retaining the real parent policy.
              await page.route(previewURL, route => route.fulfill({ contentType: 'text/html', body: html }))
              const policy = appCSP.replaceAll('codync-artifact:', 'https://preview.codync.invalid')
              await page.setContent(`<meta http-equiv="Content-Security-Policy" content="${policy}"><iframe sandbox="allow-scripts" title="Preview"></iframe>`)
              await page.locator('iframe').evaluate((element, url) => { element.src = url }, previewURL)
              const frame = page.frameLocator('iframe')
              await frame.locator(selector).first().waitFor({ timeout: 30000 })
              assert.equal(await frame.locator('#error').textContent(), '')
              await page.close()
              console.log(`${kind}: rendered offline inside sandbox`)
            }
            const layoutCSS = await readFile('src/renderer/views/thread/thread.css', 'utf8')
            const traceCSS = await readFile('src/renderer/views/thread/trace.css', 'utf8')
            const command = 'cp "/Users/user/' + 'a'.repeat(400) + '/cosmic.jpg" "/Users/user/output.jpg"'
            for (const width of [220, 480, 900]) {
              const page = await context.newPage()
              await page.setContent(`<style>
                * { box-sizing: border-box; transition: none !important; animation: none !important; }
                :root { --agent-bubble-max: 100%; --radius-xl: 18px; --bubble-agent: #222; }
                .hstack { display: flex; align-items: center; gap: 8px; }
                .vstack { display: flex; flex-direction: column; }
                .truncate { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
                ${layoutCSS} ${traceCSS}
                #fixture { width: ${width}px; }
              </style><div id="fixture"><div class="chat-working shown"><div class="chat-working-clip"><div class="chat-working-content">
                <div class="vstack agent-inset" style="align-items:flex-start"><div class="working">
                  <button class="working-toggle"><span class="hstack working-status-row">
                    <span>◌</span><span id="activity" class="truncate working-status-text" style="flex:1;min-width:0"></span><span id="timer">12:34</span><span>›</span>
                  </span></button>
                </div></div>
              </div></div></div></div>`)
              await page.locator('#activity').evaluate((element, command) => { element.textContent = command }, command)
              const fits = await page.evaluate(() => {
                const edge = document.querySelector('#fixture').getBoundingClientRect().right
                return ['.working', '.working-toggle', '.working-status-row', '#timer'].every(selector => document.querySelector(selector).getBoundingClientRect().right <= edge + 1)
              })
              assert.ok(fits, `Working indicator overflowed at ${width}px`)
              await page.locator('.working').evaluate(element => element.classList.add('expanded'))
              await page.locator('.working').evaluate((element, command) => {
                const row = document.createElement('div'); row.className = 'hstack'; row.style.minWidth = '0'
                const title = document.createElement('span'); title.id = 'tool-title'; title.className = 'trace-tool-title'; title.style.cssText = 'flex:1;min-width:0'; title.textContent = command
                row.append(title); element.append(row)
              }, command)
              assert.ok(await page.locator('#tool-title').evaluate(element => element.scrollWidth <= element.clientWidth + 1 && element.getBoundingClientRect().height > 24), `Long tool title did not wrap at ${width}px`)
              await page.close()
            }
            console.log('Long activity paths fit compact and expanded layouts at all three widths')
            assert.deepEqual(requests.filter(url => url !== previewURL), [], 'Rendering must make no external network requests')
          } finally {
            await browser.close()
          }
          JS

      - name: Add macOS targets
        working-directory: host
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
          # A late failure (signing, network) still leaves the expensive release build cached.
          cache-on-failure: true

      - name: Check and test the host
        working-directory: host
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --bin codync-host
          cargo test --test files_e2e -- --test-threads=1
          cargo test --test e2e explicitly_streamed_message_updates_one_entry_and_finishes -- --test-threads=1
          cargo test --test e2e unfinished_stream_is_cleared_after_host_restart -- --test-threads=1

      - name: Build the iOS package
        working-directory: apps/ios/Kit
        run: >-
          xcodebuild -scheme CodyncUI -destination 'generic/platform=iOS'
          -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO build

      - name: Native pieces
        env:
          # The runner's Rust objcopy cannot load libLLVM. Use Apple's strip below.
          CARGO_PROFILE_RELEASE_STRIP: "none"
        run: |
          mkdir -p apps/desktop/build/native
          # The host the app bundles (tools/native-host.mjs builds it; universal for release,
          # this build is Apple Silicon only).
          node apps/desktop/tools/account-config.mjs main
          node apps/desktop/tools/native-host.mjs main
          strip -S -x apps/desktop/build/native/codync-host
          # The screen target embeds the pinned cua-driver from GitHub. Fetch it here, with
          # retries, so a slow runner network doesn't fail the Xcode build phase; the script
          # checks the pinned SHA-256 and keeps the archive in build/cua-driver.
          for attempt in 1 2 3 4 5; do
            node packaging/cua-driver/fetch.mjs darwin "$RUNNER_TEMP/cua-driver" "$RUNNER_TEMP/cua-driver" && break
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep 15
          done
          # Remote screen helper, unsigned; the ad-hoc signing step signs it after packaging.
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate --spec apps/project.yml
          node apps/desktop/tools/native-screen.mjs main
          # On-device speech for calls.
          swift build -c release --arch arm64 --package-path apps/desktop/native/speech-macos
          cp "$(swift build -c release --arch arm64 --package-path apps/desktop/native/speech-macos --show-bin-path)/codync-speech" \
            apps/desktop/build/native/codync-speech

      - name: Build and package (ad-hoc, no notarization)
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          # The shipped config notarizes with the repository's Apple secrets; a fork has none.
          sed -i '' 's/^  notarize: true$/  notarize: false/' electron-builder.yml
          npm run build
          npx electron-builder --mac dir --arm64 --publish never

      - name: Sign ad-hoc and pack the app
        working-directory: apps/desktop
        run: |
          # An unsigned arm64 binary is killed on launch; an ad-hoc signature runs locally.
          # Electron's helpers ship sealed, and packaging changes their resources, so re-sign
          # the whole bundle recursively: an outer-only signature trips over their stale seals.
          APP="$(ls -d dist/mac-*/Codync.app | head -n 1)"
          echo "app: $APP"
          # Ad-hoc builds use GitHub release checks, not the signed Squirrel installer.
          node -e 'require("node:fs").writeFileSync(process.argv[1], JSON.stringify({runId: Number(process.env.GITHUB_RUN_ID), commit: process.env.GITHUB_SHA}))' \
            "$APP/Contents/Resources/fork-updates.json"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # Gatekeeper still quarantines a download: FORK.md has the one `xattr` command.
          # Asset names match the upstream release, so a download reads the same.
          ditto -c -k --keepParent "$APP" "dist/codync-macos.zip"
          hdiutil create -volname "Codync" -srcfolder "$APP" -ov -format UDZO "dist/codync-macos.dmg"
          (cd dist && shasum -a 256 codync-macos.zip > codync-macos.zip.sha256 \
            && shasum -a 256 codync-macos.dmg > codync-macos.dmg.sha256)
          cat dist/codync-macos.zip.sha256 dist/codync-macos.dmg.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: codync-macos-arm64-unsigned
          path: |
            apps/desktop/dist/codync-macos.zip
            apps/desktop/dist/codync-macos.zip.sha256
            apps/desktop/dist/codync-macos.dmg
            apps/desktop/dist/codync-macos.dmg.sha256
          retention-days: 14

      # Actions artifacts need an account and expire; a release is a plain download link.
      # Publish normal version tags. Existing tags and releases are never moved or replaced.
      # Later builds at the same version remain available as workflow artifacts.
      - name: Publish the release
        if: github.ref == 'refs/heads/main'
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; preserving its release assets."
            exit 0
          fi
          # An existing unpublished tag can belong to an older build. Never relabel new code as that tag.
          # Query actual remote refs: gh api prints error JSON on stdout for a missing tag.
          # An empty successful listing means the tag is absent; network/auth errors fail the step.
          TAG_REF="$(git ls-remote --refs origin "refs/tags/$TAG")"
          if [ -n "$TAG_REF" ]; then
            git fetch --no-tags --depth=1 origin "refs/tags/$TAG"
            TAG_COMMIT="$(git rev-parse 'FETCH_HEAD^{commit}')"
            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "$TAG names an earlier commit; this build remains available as a workflow artifact."
              exit 0
            fi
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" --latest \
            --notes "Codync — build of \`$GITHUB_SHA\` ($(date -u +%Y-%m-%dT%H:%MZ)).
          Apple Silicon, ad-hoc signed, not notarized; see FORK.md for the one-time \`xattr\` command." \
            dist/codync-macos.zip dist/codync-macos.zip.sha256 \
            dist/codync-macos.dmg dist/codync-macos.dmg.sha256
